name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Puzzle logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Download Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and run the Godot project headlessly
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path godot --editor --quit > /tmp/godot-import.log 2>&1
          cat /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/godot-import.log; then exit 1; fi
          "$GODOT" --headless --path godot --quit-after 2 > /tmp/godot-run.log 2>&1
          cat /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/godot-run.log; then exit 1; fi
