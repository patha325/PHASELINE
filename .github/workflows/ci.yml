name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Puzzle logic tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Download Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            --output /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mv /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import and run the Godot project headlessly
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path godot --editor --quit > /tmp/godot-import.log 2>&1
          cat /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/godot-import.log; then exit 1; fi
          "$GODOT" --headless --path godot --quit-after 2 > /tmp/godot-run.log 2>&1
          cat /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/godot-run.log; then exit 1; fi
      - name: Play through the campaign in Godot
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/AutomatedPlaytest.gd
      - name: Export Windows release build
        run: |
          mkdir -p godot/build/windows
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-release "Windows Desktop" build/windows/PHASELINE.exe
          test -s godot/build/windows/PHASELINE.exe
      - name: Export and smoke-test Linux release build
        run: |
          mkdir -p godot/build/linux
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-release "Linux/X11" build/linux/PHASELINE.x86_64
          test -s godot/build/linux/PHASELINE.x86_64
          chmod +x godot/build/linux/PHASELINE.x86_64
          godot/build/linux/PHASELINE.x86_64 --headless --quit-after 5 > /tmp/phaseline-export-smoke.log 2>&1
          cat /tmp/phaseline-export-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/phaseline-export-smoke.log; then exit 1; fi
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHASELINE-Windows-${{ github.sha }}
          path: godot/build/windows/PHASELINE.exe
          if-no-files-found: error
          retention-days: 14
